-- Conky configuration settings
-- Modified by Chief-Github

conky.config = {
    update_interval = 1.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    out_to_console = false,
    override_utf8_locale = true,
    use_xft = true,
    own_window_transparent = false,
    own_window_argb_visual = yes,
    own_window_argb_value  = 145,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    alignment = 'top_right',
    gap_x = 18,                               -- Comfortable gap from the right edge
    gap_y = 24,                               -- Comfortable gap from the top edge
    minimum_width = 290,                      -- Narrower width (kept)
    maximum_width = 290,
    minimum_height = 490,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    out_to_x = false,
    out_to_wayland = true,
    
    -- Coastal High-Contrast palette
    default_color = '#FFFFFF',      -- Main text (pure white for max legibility)

    color1 = '#D0E4F2',             -- Labels (light icy blue)
    color2 = '#A0AABA',             -- Secondary text (cool gray)
    color3 = '#FF3B3B',             -- Warnings / critical (bright red)
    color4 = '#0D1B2A',             -- Separators / lines (near-black navy)
    color5 = '#4DA8DA',             -- Headings (clear sky blue)
    color6 = '#2ECC71',             -- Bars / accents (bright emerald green)
    color7 = '#F5C26B',             -- Secondary accent (golden sand)
    color8 = '#5DFF9C',             -- Good/charging states (neon green)

    font  = 'Liberation Mono:size=10',
    font1 = 'Liberation Mono:size=11',  -- Headings / date-time
}

-- Conky text block
conky.text = [[${voffset 0}${goto 12}${color1}${font1}${time %A, %B %d %Y}${font}
${goto 12}${color1}${font1}${time %I:%M:%S %p}${font}
${if_existing /sys/class/power_supply/BAT0}${if_match ${battery_percent BAT0} < 15}${voffset 4}${goto 12}${color1}${scroll left 10 0.5 LOW BATTERY - ${battery_percent BAT0}% remaining!}${endif}${endif}
${voffset 8}${goto 12}${color1}Uptime: ${color2}${uptime}

${goto 12}${color1}${execi 3600 bash -lc 'd=$(date +%j); y=$(date +%Y); t=$(date -d "$y-12-31" +%j); echo $((d*100/t))'}% through the year, never go slow! \

${goto 12}${color6}${execibar 3600 bash -lc 'd=$(date +%j); y=$(date +%Y); t=$(date -d "$y-12-31" +%j); echo $((d*100/t))'}

${voffset 8}${color4}${goto 12}---------------------------------------------------------------------${color1}
${voffset 4}${goto 12}${color5}${font1}Batteries${voffset 4}${font}
${if_existing /sys/class/power_supply/BAT0}  ${goto 12}${if_match "${battery_status BAT0}" == "charging" || "${battery_status BAT0}" == "Full"}${color8}+${else}${color3}-${endif} ${color1}BAT0: ${color2}${battery_percent BAT0}% ${color4}${battery_bar 4,45 BAT0}${color6}${alignr}${color2}Est: ${battery_time BAT0}${endif}
${color2}${execi 1000 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep "charge-cycles"}
${color2}${execi 1000 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep "capacity:"}
${color grey}    Profile: ${execi 60 powerprofilesctl get}

${voffset 8}${color4}${goto 12}---------------------------------------------------------------------${color1}
${voffset 4}${goto 12}${color5}${font1}System Usage${voffset 4}${font}
  ${goto 12}${color1}RAM: ${color2}${memperc}% ${color4}${membar 4,80}${color6} ${color2}${mem}/${memmax}
  ${goto 12}${color1}Swap: ${color2}${swapperc}% ${color4}${swapbar 4,80}${color6} ${color2}${swap}/${swapmax}
  ${goto 12}${color1}CPU: ${color2}${cpu}% ${color4}${cpubar 4,80}${color6}
  ${goto 12}${color1}CPU Temp: ${color2}${acpitemp}°C
  ${goto 12}${color1}Home: ${color2}${fs_used /home} / ${fs_size /home}
   ${color4}${fs_bar 4,100 /home}
  ${voffset 8}${goto 12}${color1}Load Avg: ${color2}${loadavg 1} ${loadavg 2} ${loadavg 3}
  
  ${voffset 8}${goto 12}${color1}Top CPU:${font}          CPU % ${alignr}Mem (MiB)
  ${goto 12}${color2}${top name 1}${top cpu 1}%${alignr}${top mem 1}
  ${goto 12}${color2}${top name 2}${top cpu 2}%${alignr}${top mem 2}
  ${goto 12}${color2}${top name 3}${top cpu 3}%${alignr}${top mem 3}
    
${voffset 8}${color4}${goto 12}---------------------------------------------------------------------${color1}
${voffset 4}${goto 12}${color5}${font1}Network${voffset 4}${font}
${if_up wlan0}  ${goto 12}${color1}Status: ${color2}Connected ${color4}${wireless_link_bar 4,50 wlan0}${color6}
  ${goto 12}${color1}Up: ${color2}${upspeed wlan0} (${totalup wlan0})
  ${goto 12}${color1}Down: ${color2}${downspeed wlan0} (${totaldown wlan0})${else}  ${goto 12}${color1}Status: ${color2}Disconnected (Wi-Fi)${endif}
  ${color1}Ping: ${color2}${execi 300 ping -c 1 google.com | grep 'time=' | cut -d'=' -f4}

${voffset 8}${color4}${goto 12}---------------------------------------------------------------------{color1}
${voffset 8}${goto 12}${color1}Processes: ${color2}${processes}
${goto 12}${color1}Running: ${color2}${running_processes}${alignr}${color1}Threads: ${color2}${running_threads}

${voffset 8}${color4}${goto 12}---------------------------------------------------------------------${color1}
${voffset 8}${goto 12}${color5}Go fast. Avoid Police.


]]