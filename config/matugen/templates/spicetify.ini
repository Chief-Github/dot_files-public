; MADE BY CHIEF-GITHUB - matugen template -> StarryNight color scheme
; generated file - edit ~/.config/matugen/templates/spicetify.ini
; original StarryNight schemes preserved at color.ini.orig

[Matugen]
; the stars themselves - white-ish stars, wallpaper-coloured glow
star                    = {{colors.on_surface.dark.hex_stripped}}
star-glow               = {{colors.primary.dark.hex_stripped}}
shooting-star           = {{colors.on_surface.dark.hex_stripped}}
shooting-star-glow      = {{colors.primary.dark.hex_stripped}}

main                    = 000000 ; becomes 100% transparent via javascript
main-elevated           = {{colors.surface_container.dark.hex_stripped}}
card                    = {{colors.surface_container.dark.hex_stripped}}

; night sky gradient - horizon glows in wallpaper hue, space stays black
sidebar                 = {{colors.on_primary.dark.hex_stripped}} ; bottom part of sky
sidebar-alt             = {{colors.shadow.dark.hex_stripped}} ; top part of sky

text                    = {{colors.on_surface.dark.hex_stripped}}
subtext                 = {{colors.on_surface_variant.dark.hex_stripped}}

button                  = {{colors.primary.dark.hex_stripped}}
button-active           = {{colors.inverse_primary.dark.hex_stripped}}
button-disabled         = {{colors.outline.dark.hex_stripped}}

highlight               = {{colors.surface_container_high.dark.hex_stripped}}
highlight-elevated      = {{colors.surface_container_high.dark.hex_stripped}}

shadow                  = {{colors.shadow.dark.hex_stripped}}
selected-row            = {{colors.on_surface.dark.hex_stripped}}
misc                    = {{colors.outline.dark.hex_stripped}}
notification-error      = {{colors.error.dark.hex_stripped}}
notification            = {{colors.primary.dark.hex_stripped}}
tab-active              = {{colors.surface_container_high.dark.hex_stripped}}
player                  = {{colors.surface_container_lowest.dark.hex_stripped}}
