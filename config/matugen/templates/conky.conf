-- Conky configuration settings
-- Modified by Chief-Github
-- https://github.com/Chief-Github/Hypr_dots
-- Generated colors by matugen

conky.config = {
    update_interval = 1.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    out_to_console = false,
    override_utf8_locale = true,
    use_xft = true,
    xftalpha = 0.9,
    uppercase = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    alignment = 'top_right',
    gap_x = 6,
    gap_y = 24,
    minimum_width = 290,
    maximum_width = 290,
    minimum_height = 490,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    out_to_x = false,
    out_to_wayland = true,

    default_color = '{{colors.on_surface.default.hex}}',
    color1 = '{{colors.on_surface.default.hex}}',           -- Labels
    color2 = '{{colors.on_surface_variant.default.hex}}',   -- Dimmed values
    color3 = '{{colors.error.default.hex}}',                -- Warnings, discharging battery
    color4 = '{{colors.outline_variant.default.hex}}',      -- Separator lines
    color5 = '{{colors.primary.default.hex}}',              -- Headings
    color6 = '{{colors.secondary.default.hex}}',            -- Bars/accent
    color7 = '{{colors.tertiary.default.hex}}',             -- Secondary accent
    color8 = '{{colors.tertiary_container.default.hex}}',   -- Good states (charging etc)
    font = 'Liberation Mono:size=10',
    font1 = 'Liberation Mono:size=11',
}

-- Conky text block goto used to be 12
conky.text = [[${voffset 0}${goto 5}${color1}${font1}${time %A, %B %d %Y}${font}
${goto 5}${color1}${font1}${time %I:%M:%S %p}${font}
${if_existing /sys/class/power_supply/BAT0}${if_match ${battery_percent BAT0} < 15}${voffset 4}${goto 5}${color1}${scroll left 10 0.5 LOW BATTERY - ${battery_percent BAT0}% remaining!}${endif}${endif}
${voffset 8}${goto 5}${color1}Uptime: ${color2}${uptime}

${goto 5}${color1}${execi 3600 bash -lc 'd=$(date +%j); y=$(date +%Y); t=$(date -d "$y-12-31" +%j); echo $((d*100/t))'}% through the year, never go slow! \

${goto 5}${color6}${execibar 3600 bash -lc 'd=$(date +%j); y=$(date +%Y); t=$(date -d "$y-12-31" +%j); echo $((d*100/t))'}

${voffset 8}${color4}---------------------------------------------------------------------${color1}
${voffset 4}${goto 5}${color5}${font1}Batteries${voffset 4}${font}
${if_existing /sys/class/power_supply/BAT0}  ${goto 5}${if_match "${battery_status BAT0}" == "charging" || "${battery_status BAT0}" == "Full"}${color8}+${else}${color3}-${endif} ${color1}BAT0: ${color2}${battery_percent BAT0}% ${color4}${battery_bar 4,45 BAT0}${color6}${alignr}${color2}Est: ${battery_time BAT0}${endif}
${goto 5}${color2}${execi 1000 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep "charge-cycles"}
${goto 5}${color2}${execi 1000 upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep "capacity:"}
${goto 5}${color grey}    Profile: ${execi 60 powerprofilesctl get}

${voffset 8}${color4}---------------------------------------------------------------------${color1}
${voffset 4}${goto 5}${color5}${font1}System Usage${voffset 4}${font}
  ${goto 5}${color1}RAM: ${color2}${memperc}% ${color4}${membar 4,80}${color6} ${color2}${mem}/${memmax}
  ${goto 5}${color1}Swap: ${color2}${swapperc}% ${color4}${swapbar 4,80}${color6} ${color2}${swap}/${swapmax}
  ${goto 5}${color1}CPU: ${color2}${cpu}% ${color4}${cpubar 4,80}${color6}
  ${goto 5}${color1}CPU Temp: ${color2}${acpitemp}°C
  ${goto 5}${color1}Home: ${color2}${fs_used /home} / ${fs_size /home}
  ${goto 5}${color4}${fs_bar 4,100 /home}
  ${voffset 8}${goto 5}${color1}Load Avg: ${color2}${loadavg 1} ${loadavg 2} ${loadavg 3}

  ${voffset 8}${goto 5}${color1}Top CPU:${font}          CPU % ${alignr}Mem (MiB)
  ${goto 5}${color2}${top name 1}${top cpu 1}%${alignr}${top mem 1}
  ${goto 5}${color2}${top name 2}${top cpu 2}%${alignr}${top mem 2}
  ${goto 5}${color2}${top name 3}${top cpu 3}%${alignr}${top mem 3}

${voffset 8}${color4}---------------------------------------------------------------------${color1}
${voffset 4}${goto 5}${color5}${font1}Network${voffset 4}${font}
${if_up wlan0}  ${goto 5}${color1}Status: ${color2}Connected ${color4}${wireless_link_bar 4,50 wlan0}${color6}
  ${goto 5}${color1}Up: ${color2}${upspeed wlan0} (${totalup wlan0})
  ${goto 5}${color1}Down: ${color2}${downspeed wlan0} (${totaldown wlan0})${else}  ${goto 5}${color1}Status: ${color2}Disconnected (Wi-Fi)${endif}
  ${goto 5}${color1}Ping: ${color2}${execi 300 ping -c 1 google.com | grep 'time=' | cut -d'=' -f4}

${voffset 8}${color4}---------------------------------------------------------------------{color1}
${voffset 8}${goto 5}${color1}Processes: ${color2}${processes}
${goto 5}${color1}Running: ${color2}${running_processes}${alignr}${color1}Threads: ${color2}${running_threads}

${voffset 8}${color4}---------------------------------------------------------------------${color1}
${voffset 8}${goto 5}${color5}Go fast. Avoid Police.


]]
