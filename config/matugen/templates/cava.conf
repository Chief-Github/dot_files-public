## Configuration file for CAVA.
# From Chief-github's dot files https://github.com/Chief-Github/dot_files-public
# Remove the ; to change parameters.

[general]
; mode = normal
framerate = 60
; autosens = 1
; overshoot = 20
; sensitivity = 100
; bars = 10
; bar_width = 2
; bar_spacing = 1
; bar_height = 32
; bar_width = 20
; bar_spacing = 5
bar_width = 0.8
; bar_spacing = 0
; center_align = 1
; max_height = 100
; lower_cutoff_freq = 50
; higher_cutoff_freq = 10000
; sleep_timer = 0

[input]
; method = pulse
; source = auto
; method = pipewire
; source = auto
; method = alsa
; source = hw:Loopback,1
; method = fifo
; source = /tmp/mpd.fifo
; method = shmem
; source = /squeezelite-AA:BB:CC:DD:EE:FF
; method = portaudio
; source = auto
; method = sndio
; source = default
; method = oss
; source = /dev/dsp
; method = jack
; source = default
; sample_rate = 44100
; sample_bits = 16
; channels = 2
; autoconnect = 2
; active = 0
; remix = 1
; virtual = 1

[output]
; method = noncurses
; orientation = bottom
; channels = stereo
; mono_option = average
; reverse = 0
; raw_target = /dev/stdout
; data_format = binary
; bit_format = 16bit
; ascii_max_range = 1000
; bar_delimiter = 59
; frame_delimiter = 10
; sdl_width = 1024
; sdl_height = 512
; sdl_x = -1
; sdl_y= -1
; sdl_full_screen = 0
; xaxis = none
; synchronized_sync = 0
; vertex_shader = pass_through.vert
; fragment_shader = bar_spectrum.frag
; continuous_rendering = 0
; disable_blanking = 0
; show_idle_bar_heads = 1
; waveform = 0

[color]
background = 'default'
gradient = 1
gradient_count = 4
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.secondary.default.hex}}'
gradient_color_4 = '{{colors.inverse_primary.default.hex}}'

[smoothing]
monstercat = 1
; waves = 0
noise_reduction = 77

[eq]
; 1 = 1
; 2 = 1
; 3 = 1
; 4 = 1
; 5 = 1
