# ## Ecosystem ##
# ###############

ecosystem {
  no_update_news = false
  no_donation_nag = false
}

###################
### KEYBINDINGS ###
###################
# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
#############
### BASIC ###
#############
bind = $mainMod, Q, exec, $terminal #normal terminal
bind = $mainMod, S, exec, cool-retro-term --fullscreen #fancy terminal
bind = $mainMod, F, fullscreen 
bind = $mainMod, C, killactive
bind = $mainMod, M, exit, #goes back to sddm
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, kitty --title yazi -e yazi #CMD File mananger
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu2 #rofi
bind = $mainMod SHIFT, R, exec, $menu #wofi (fallback)
bind = $mainMod, K, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindlep
bind = $mainMod, T, exec, rofi -show theme
bind = $mainMod, semicolon, exec, rofi -modi emoji -show emoji -kb-secondary-copy "" -kb-custom-1 Ctrl+c
bind = $mainMod, Tab, workspace, previous
bind = $mainMod ALT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

############
### APPS ###
############
bind = $mainMod, L, exec, wlogout # originally was hyprlock
bind = $mainMod, B, exec, firefox
bind = $mainMod, P, exec, waypaper
bind = $mainMod, O, exec, obsidian
bind = $mainMod, I, exec, nwg-look
bind = $mainMod, X, exec, pkill rofi # !force kill if breaks!

bind = $mainMod, W, exec, swaync-client -t #open swaync quickmenu
bind = $mainMod SHIFT, S, exec, hyprshot -m region --freeze -o ~/screenshots
bind = $mainMod, H, exec, ~/scripts/flashing_keyboard.sh
bind = $mainMod SHIFT, H, exec, ~/scripts/flashing_keyboard_FAST.sh
bind = $mainMod ALT, S, exec, ~/.config/hypr/edit_screenshot.sh
bind = $mainMod SHIFT, F, fullscreenstate, 0 3 # Fullscreen spoof

# Window split ratio
#binde = $mainMod, Comma, splitratio, -0.15 # [hidden]
#binde = $mainMod, period, splitratio, +0.15 # [hidden]

binde = $mainMod, Minus, exec, ~/.config/hypr/scripts/zoom.sh decrease 0.5 #  Zoom out
binde = $mainMod, Equal, exec, ~/.config/hypr/scripts/zoom.sh increase 0.5 #  Zoom in
binde = $mainMod, Backspace, exec, ~/.config/hypr/scripts/zoom.sh reset #  Zoom in

binde = $mainMod SHIFT, Minus, exec, ~/.config/hypr/scripts/blur_change.sh decrease 1 #  blur out
binde = $mainMod SHIFT, Equal, exec, ~/.config/hypr/scripts/blur_change.sh increase 1 #  blur increase
binde = $mainMod SHIFT, Backspace, exec, ~/.config/hypr/scripts/blur_change.sh reset #  blur reset

bind = $mainMod SHIFT, P, pin # Pin

