################################
#### Universal Window rules ####
################################
# I found this out while looking through various dot files
# These window rules basically make it so any app trying to
# open files, folders etc will open in a popout window.
windowrule = float on, center on, match:title ^(Open File)(.*)$
windowrule = float on, center on, match:title ^(Select a File)(.*)$
windowrule = float on, center on, match:title ^(Open Directory)(.*)$
windowrule = float on, center on, match:title ^(Open Folder)(.*)$
windowrule = float on, center on, match:title ^(Save As)(.*)$
windowrule = float on, center on, match:title ^(.*)(wants to save)$
windowrule = float on, center on, match:title ^(.*)(wants to open)$

####################
### STARTUP APPS ###
####################
# fastfetch window - STARTUP
windowrule = match:class ^(neofetch-startup), float on, size 666 346, move 489 64, workspace 1


#Chatgpt
windowrule = match:class ^(chatgpt)$, float on, size 467 903, move 12 43, workspace special:chatgpt silent
bind = $mainMod, a, togglespecialworkspace, chatgpt
bind = $mainMod SHIFT, A, movetoworkspace, special:chatgpt





# Ignore maximize requests from apps. You'll probably like this.
#windowrule = suppressevent maximize, class:.*
windowrule = match:class .*, suppress_event maximize


