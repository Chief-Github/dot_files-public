# https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################
# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preffered,auto,1.25
# Fractional scailing can mess up some apps.

debug:overlay = 0
debug:vfr = true
# Debug overlay (show fps etc - check rofi menu)
 
###################
### MY PROGRAMS ###
###################
