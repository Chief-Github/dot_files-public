#####################
### LOOK AND FEEL ###
#####################
# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10
    
    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(138,43,226)

    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1#0.8
    dim_special = 0.6

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }


    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3 # blurrier
        passes = 3  # smoother
        vibrancy = 0.1696 # optional tweak for saturation

    
        xray = false # see wallpaper behind blurred popout window (even on top of another window)
        noise = 0
        special = true
        new_optimizations = true
        popups = false # blurred border on popups
    }
}

###################
### ANIMATIONS ###
###################
# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :D
    workspace_wraparound = false
    # https://wiki.hypr.land/Configuring/Animations/

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = liner, 1, 1, 1, 1
    bezier = slideInFromRight, 0.5, 0.0, 0.5, 1.0

    bezier = bounce, 0.4, 0.9, 0.6, 1.0
    bezier = snappyReturn, 0.4, 0.9, 0.6, 1.0
    bezier = slideInFromRight, 0.5, 0.0, 0.5, 1.0

    bezier = winIn, 0.07, 0.88, 0.04, 0.99
    bezier = winOut, 0.20, -0.15, 0, 1
    bezier = easeOutCirc, 0, 0.48, 0.38, 1

    
    # Curves (taken from end-4's dots, thanks.)
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1.2        #default : 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1.02
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08

    #animation = NAME, ONOFF, SPEED, CURVE [,STYLE]
    #animation site - https://easings.net/#


    animation = global, 1, 10, default
    animation = border, 1, 1, linear
    animation = borderangle, 1, 30, liner, loop #used by rainbow borders and rotating colors    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4, snappyReturn, slidevert right 
    animation = windowsOut, 1, 4, easeOutCirc
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick 
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 3, bounce, slidevert right      # 1, 4, easeOutQuint, fade 
    animation = layersOut, 1, 10, bounce, slidevert right 
    animation = fadeLayersIn, 1, 1.79, almostLinear #original 1, 1.79
    animation = fadeLayersOut, 1, 1.39, almostLinear #original 1, 1.39
    animation = workspaces, 1, 7, menu_decel, slide
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1, emphasizedAccel, slidevert
}



# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
#    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(    
}



#############
### INPUT ###
#############
# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}
# Example per-device config
# See https://wiki.hypr2.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


